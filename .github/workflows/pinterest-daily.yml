name: DRESSOPP — Synchronisation Pinterest quotidienne

on:
  schedule:
    - cron: "0 12 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/pinterest-daily.yml"

permissions:
  contents: write

concurrency:
  group: dressopp-pinterest-sync
  cancel-in-progress: false

jobs:
  sync-pinterest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer DRESSOPP
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Vérifier le code et les tests
        run: npm test

      - name: Vérifier la disponibilité du Worker Cloudflare
        run: |
          curl --fail-with-body --silent --show-error --max-time 20 \
            -H "Origin: https://sopp24.github.io" \
            "https://dressopp-agent.asoppelsa.workers.dev/health"
      # Images sent to the private Cloudflare vision endpoint; token is read only from Actions secrets.
      # Retry the full visual enrichment after the Worker redirect fix (2026-11-09).
      - name: Lire le tableau Pinterest et repérer les nouvelles épingles
        run: node scripts/sync-pinterest.mjs
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_NAME: mode
          PINTEREST_ANALYSIS_ENDPOINT: https://dressopp-agent.asoppelsa.workers.dev
          PINTEREST_SYNC_TOKEN: ${{ secrets.PINTEREST_SYNC_TOKEN }}

      - name: Enregistrer le flux public des épingles
        id: save-feed
        run: |
          if [[ -n "$(git status --porcelain data/pinterest-pins.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/pinterest-pins.json
            git commit -m "Synchroniser les nouvelles épingles Pinterest"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Aucune modification Pinterest à enregistrer."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
