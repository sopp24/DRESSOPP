name: DRESSOPP — Catalogue public multi-sources

on:
  schedule:
    - cron: "17 8 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dressopp-public-catalog
  cancel-in-progress: false

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérifier le code et les tests
        run: npm test
      - name: Explorer les boutiques publiques autorisées
        run: node scripts/refresh-public-catalog.mjs
      - name: Enregistrer les changements du catalogue
        id: commit-catalog
        run: |
          if [[ -n "$(git status --porcelain data/catalog.json data/catalog-meta.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/catalog.json data/catalog-meta.json
            git commit -m "Actualiser le catalogue public multi-sources"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun changement dans le catalogue public."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publier le catalogue sur GitHub Pages
        if: steps.commit-catalog.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
