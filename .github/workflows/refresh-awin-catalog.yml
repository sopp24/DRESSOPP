name: DRESSOPP — Actualisation du catalogue multi-boutiques

on:
  schedule:
    - cron: "17 1,5,9,13,17,21 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dressopp-awin-catalog
  cancel-in-progress: false

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer DRESSOPP
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tester l'application et l'importeur de flux
        run: npm test

      - name: Vérifier la configuration Awin
        id: awin-config
        env:
          AWIN_PRODUCT_FEED_LIST_URL: ${{ secrets.AWIN_PRODUCT_FEED_LIST_URL }}
        run: |
          if [[ -n "$AWIN_PRODUCT_FEED_LIST_URL" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWIN_PRODUCT_FEED_LIST_URL absent. Le catalogue existant est conservé."
          fi

      - name: Télécharger les flux produits autorisés et recalculer le catalogue
        if: steps.awin-config.outputs.configured == 'true'
        env:
          AWIN_PRODUCT_FEED_LIST_URL: ${{ secrets.AWIN_PRODUCT_FEED_LIST_URL }}
          AWIN_PUBLISHER_API_TOKEN: ${{ secrets.AWIN_PUBLISHER_API_TOKEN }}
        run: node scripts/refresh-awin-catalog.mjs

      - name: Enregistrer les changements du catalogue
        id: commit-catalog
        if: steps.awin-config.outputs.configured == 'true'
        run: |
          if [[ -n "$(git status --porcelain data/catalog.json data/catalog-meta.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/catalog.json data/catalog-meta.json
            git commit -m "Actualiser le catalogue marchand DRESSOPP"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun changement dans les flux produits."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier le catalogue sur GitHub Pages
        if: steps.commit-catalog.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
