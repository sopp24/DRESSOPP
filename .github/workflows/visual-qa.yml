name: DRESSOPP visual QA

on:
  workflow_run:
    workflows: ["Deploy DRESSOPP to GitHub Pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  visual-qa:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test published experience at six viewport sizes
        env:
          DRESSOPP_BASE_URL: https://sopp24.github.io/DRESSOPP/
        run: node scripts/visual-qa.mjs
      - name: Publish the machine-readable report on a separate branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f artifacts/visual-qa/report.json ]; then
            echo "No report file was generated."
            exit 0
          fi
          mkdir -p /tmp/dressopp-visual-report
          cp artifacts/visual-qa/report.json /tmp/dressopp-visual-report/report.json
          cd /tmp/dressopp-visual-report
          git init --initial-branch=visual-qa-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.json
          git commit -m "Visual QA report ${GITHUB_RUN_ID}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:visual-qa-results
      - name: Upload screenshots and visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dressopp-visual-qa-${{ github.event.workflow_run.head_sha }}
          path: artifacts/visual-qa/
          if-no-files-found: warn
          retention-days: 7
