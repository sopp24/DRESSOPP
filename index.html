<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="DRESSOPP, accueil">
        <img class="brand-logo" src="./assets/logo-horizontal.png" alt="DRESSOPP" width="204" height="98">
      </a>
      <nav class="main-nav" aria-label="Navigation principale">
        <button class="nav-link is-active" type="button" data-view="discover"><span class="nav-icon">✳</span><span>Découvrir</span></button>
        <button class="nav-link" type="button" data-view="wardrobe"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 18" width="15" height="15" fill="currentColor" focusable="false"><path d="M12 17C10.7 15.9 3 10 2 6.6 1 3.1 3.3 1 6.7 1c2.3 0 4.2 1.2 5.3 3 1.1-1.8 3-3 5.3-3 3.4 0 5.7 2.1 4.7 5.6-1 3.4-8.7 9.3-10 10.4Z"/></svg></span><span>Vêtements</span><span class="nav-count" id="wardrobe-count">0</span></button>

      </nav>
      <div class="top-actions">
        <a class="footer-legal-link" href="./privacy.html">Politique de confidentialité</a>
        
        <button class="icon-button" type="button" data-view="profile" aria-label="Mon profil" title="Mon profil"><span>◉</span></button>
        <button class="icon-button" type="button" data-view="settings" aria-label="Paramètres" title="Paramètres"><span>⚙</span></button>
        <button class="add-button" type="button" data-action="add-product"><span>＋</span><span>Ajouter un article</span></button>
      </div>
    </header>
    <main id="app-main" class="main-content" tabindex="-1">
      <div class="boot-loader"><span class="loader-mark">D.</span><span>Préparation de ton dressing…</span></div>
    </main>
    <footer class="app-footer">
      <span>DRESSOPP <span class="footer-separator">/</span> Mode diligente.</span>
      
      <span class="save-status" id="save-status"><i class="status-dot"></i><span>Stockage local prêt</span></span>
    </footer>
  </div>
  <nav class="mobile-nav" aria-label="Navigation mobile">
    <button type="button" data-view="discover" class="is-active"><span>✳</span><small>Pour toi</small></button>
    <button type="button" data-view="wardrobe"><span aria-hidden="true"><svg viewBox="0 0 24 18" width="18" height="18" fill="currentColor" focusable="false"><path d="M12 17C10.7 15.9 3 10 2 6.6 1 3.1 3.3 1 6.7 1c2.3 0 4.2 1.2 5.3 3 1.1-1.8 3-3 5.3-3 3.4 0 5.7 2.1 4.7 5.6-1 3.4-8.7 9.3-10 10.4Z"/></svg></span><small>Vêtements</small></button>

    <button type="button" data-view="outfits"><span>✦</span><small>Tenues</small><span class="nav-count" id="outfit-count-mobile">0</span></button>
    <button type="button" data-view="profile"><span>◉</span><small>Profil</small></button>
    <button type="button" data-view="settings"><span>⚙</span><small>Réglages</small></button>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
