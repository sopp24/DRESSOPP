<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="DRESSOPP — Ton assistant personnel de style. Découvre, sélectionne et construis ta garde-robe.">
  <meta property="og:title" content="DRESSOPP — Find your style">
  <meta property="og:description" content="Découvre des vêtements, affine tes goûts et construis ta garde-robe.">
  <meta property="og:type" content="website">
  <title>DRESSOPP — Find your style</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="512x512" href="./assets/logo-square.png">
  <link rel="apple-touch-icon" href="./assets/logo-square.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="DRESSOPP, accueil">
        <span class="brand-fallback" aria-hidden="true">D.</span>
        <img class="brand-logo" src="./assets/logo-horizontal.png" alt="DRESSOPP" onload="this.previousElementSibling.hidden=true;" onerror="this.hidden=true;">
      </a>
      <nav class="main-nav" aria-label="Navigation principale">
        <button class="nav-link is-active" type="button" data-view="discover"><span class="nav-icon">✳</span><span>Découvrir</span></button>
        <button class="nav-link" type="button" data-view="wardrobe"><span class="nav-icon">♡</span><span>Ma garde-robe</span><span class="nav-count" id="wardrobe-count">0</span></button>
        <button class="nav-link" type="button" data-view="training"><span class="nav-icon">↗</span><span>Entraînement</span></button>
        <button class="nav-link" type="button" data-view="inspirations"><span class="nav-icon">⌁</span><span>Pinterest</span></button>
        <button class="nav-link" type="button" data-view="outfits"><span class="nav-icon">✦</span><span>Tenues</span></button>
      </nav>
      <div class="top-actions">
        <button class="icon-button" type="button" data-view="profile" aria-label="Mon profil" title="Mon profil"><span>◉</span></button>
        <button class="icon-button" type="button" data-view="settings" aria-label="Paramètres" title="Paramètres"><span>⚙</span></button>
        <button class="add-button" type="button" data-action="add-product"><span>＋</span><span>Ajouter un article</span></button>
      </div>
    </header>
    <main id="app-main" class="main-content" tabindex="-1">
      <div class="boot-loader"><span class="loader-mark">D.</span><span>Préparation de ton dressing…</span></div>
    </main>
    <footer class="app-footer">
      <span>DRESSOPP <span class="footer-separator">/</span> Find your style. Build your identity.</span>
      <span class="save-status" id="save-status"><i class="status-dot"></i><span>Stockage local prêt</span></span>
    </footer>
  </div>
  <nav class="mobile-nav" aria-label="Navigation mobile">
    <button type="button" data-view="discover" class="is-active"><span>✳</span><small>Découvrir</small></button>
    <button type="button" data-view="wardrobe"><span>♡</span><small>Garde-robe</small></button>
    <button type="button" data-view="training"><span>↗</span><small>Entraînement</small></button>
    <button type="button" data-view="inspirations"><span>⌁</span><small>Pinterest</small></button>
    <button type="button" data-view="outfits"><span>✦</span><small>Tenues</small></button>
    <button type="button" data-view="profile"><span>◉</span><small>Profil</small></button>
    <button type="button" data-view="settings"><span>⚙</span><small>Réglages</small></button>
  </nav>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="noscript">DRESSOPP nécessite JavaScript pour fonctionner.</p></noscript>
</body>
</html>
